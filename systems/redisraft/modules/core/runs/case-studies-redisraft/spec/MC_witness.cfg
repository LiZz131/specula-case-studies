\* Same bounds as MC_for_sandtable.cfg, without DepthBound.
\* Pass -depth on the TLC command. A hit on another invariant is still a
\* usable prefix: it ends on the action that produced the state.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 2
    LoseLimit           = 3
    SnapshotLimit       = 6
    ConfigChangeLimit   = 4
    ReadLimit           = 3
    MaxMsgBufferLimit   = 10

    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest

CHECK_DEADLOCK FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    NoFinishedLoad

\* Same bounds as MC_hunt_crashrecovery.cfg. Crash is not in MCNext.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 3
    LoseLimit           = 2
    SnapshotLimit       = 1
    ConfigChangeLimit   = 0
    ReadLimit           = 0
    MaxMsgBufferLimit   = 10

    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest

CHECK_DEADLOCK FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    SnapshotLogConsistency
    DepthBound

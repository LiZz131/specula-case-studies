\* Same bounds as MC_hunt_membership.cfg. Membership actions are not in MCNext.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 2
    CrashLimit          = 1
    LoseLimit           = 3
    SnapshotLimit       = 0
    ConfigChangeLimit   = 4
    ReadLimit           = 0
    MaxMsgBufferLimit   = 10

    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest

CHECK_DEADLOCK FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LeaderCompleteness
    ConfigChangeSafety
    DepthBound

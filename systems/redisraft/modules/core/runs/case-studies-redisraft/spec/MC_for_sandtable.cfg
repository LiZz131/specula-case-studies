\* Same bounds as MC.cfg. No symmetry: s1 must stay n1 during replay.
\* MCNext contains every Sand* action. Crash lowers commitIndex, so
\* MonotonicCommitIndexProp is not checked.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 2
    LoseLimit           = 3
    SnapshotLimit       = 2
    ConfigChangeLimit   = 2
    ReadLimit           = 3
    MaxMsgBufferLimit   = 10

    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest

CHECK_DEADLOCK FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    CommitIndexBound
    LeaderTermPositive
    CandidateVotedForSelf
    ConfigValid
    LogOffsetValid
    DepthBound

PROPERTIES
    MonotonicTermProp
    LeaderAppendOnlyProp
    LeaderCommitCurrentTermProp

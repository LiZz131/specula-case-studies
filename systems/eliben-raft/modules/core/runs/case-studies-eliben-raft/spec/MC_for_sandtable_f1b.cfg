\* Same bounds as MC_hunt_f1b.cfg.
\* MCNext does not take Crash, so this walk does not execute F1b.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    MaxRequestLimit = 0
    MaxCrashLimit = 3
    MaxLoseLimit = 2
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 10

CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    DepthBound

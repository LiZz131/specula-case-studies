\* Extra constants for this round, not one of the five modeling configs.
\* More client entries and more lost messages, and no ElectionSafety,
\* so a walk can keep going after two leaders and hit a log conflict.
\* DepthBound is still 30. Crash is not an MCNext action.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    MaxTermLimit = 4
    MaxTimeoutLimit = 6
    MaxRequestLimit = 4
    MaxCrashLimit = 0
    MaxLoseLimit = 3
    MaxAppendLimit = 6
    MaxMsgBufferLimit = 12

CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    CandidateVotedForSelfInv
    CommitIndexBoundInv
    LeaderTermPositiveInv
    NextIndexPositiveInv
    DepthBound

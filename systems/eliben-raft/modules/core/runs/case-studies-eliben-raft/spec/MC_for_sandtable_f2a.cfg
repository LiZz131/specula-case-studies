\* Same bounds as MC_hunt_f2a.cfg. No crash action; F2a itself needs none.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    MaxRequestLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 2
    MaxAppendLimit = 6
    MaxMsgBufferLimit = 12

CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    PersistedTermConsistencyInv
    DepthBound

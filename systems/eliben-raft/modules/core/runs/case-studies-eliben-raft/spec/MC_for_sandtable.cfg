\* Same bounds as MC.cfg. No symmetry: s1 must stay n1 during replay.
\* ElectionSafety stays commented out, as in MC.cfg. DepthBound stops the walk.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTermLimit = 3
    MaxTimeoutLimit = 3
    MaxRequestLimit = 2
    MaxCrashLimit = 1
    MaxLoseLimit = 1
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 6

CHECK_DEADLOCK FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    CandidateVotedForSelfInv
    CommitIndexBoundInv
    LeaderTermPositiveInv
    NextIndexPositiveInv
    DepthBound

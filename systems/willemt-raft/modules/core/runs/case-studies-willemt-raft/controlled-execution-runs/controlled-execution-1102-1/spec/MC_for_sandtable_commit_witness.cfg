\* Same bounds as MC_hunt_commit.cfg.
\* The invariant is the pre-fix LeaderCompleteness, so TLC reports the
\* counterexample that config originally found.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 5
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 3
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 6
    MaxMsgCount = 12


SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    DepthBound
    StaleLeaderWitness

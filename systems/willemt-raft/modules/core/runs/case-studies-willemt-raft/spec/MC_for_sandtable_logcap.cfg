\* Constant change for the log buffer growth path.
\* INITIAL_CAPACITY is 10, so MaxLogLength and RequestLimit are 16.
\* DepthBoundDeep gives the leader room to append past that capacity.
\* This is not a Specula hunt cfg. The 30-step cfgs are unchanged.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 16

    MaxTimeoutLimit = 4
    RequestLimit = 16
    CrashLimit = 0
    LoseLimit = 0
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 0
    MaxMsgCount = 24

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    DepthBoundDeep

\* Longer random walk of the snapshot config.
\* Same bounds as MC_for_sandtable_snapshot.cfg. DepthBoundDeep stops
\* at level 81 (80 steps) so an InstallSnapshot sent by TakeSnapshot
\* can still be delivered.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 4
    RequestLimit = 3
    CrashLimit = 1
    LoseLimit = 2
    DuplicateLimit = 0
    SnapshotLimit = 2
    BroadcastLimit = 5
    MaxMsgCount = 10

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    NoCommittedEntryDeletion
    LogConsistency
    DepthBoundDeep

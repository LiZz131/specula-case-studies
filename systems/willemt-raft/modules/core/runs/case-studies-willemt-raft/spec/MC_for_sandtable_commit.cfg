\* SandTable replay of commit hunting.
\* Same numeric bounds as MC_hunt_commit.cfg. No symmetry: s1 stays n1.
\* Crash, Duplicate and BroadcastLimit are declared so the config matches
\* the Specula file. MCNext does not take Crash, Recover or Duplicate
\* (no stock syscall). AppendEntriesAll is the library send-all and is
\* not gated by BroadcastLimit. Lose runs only when that TCP channel
\* holds exactly one message, via clear.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 5
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 3
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 6
    MaxMsgCount = 12

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LeaderCompleteness
    CommitMonotonicity
    DepthBound


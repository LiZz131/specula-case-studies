\* Longer random walk of the log config.
\* Same numeric bounds as MC_for_sandtable_log.cfg. DepthBoundDeep stops
\* at level 81 (80 steps). The 30-step cfg is unchanged.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 4
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 3
    DuplicateLimit = 2
    SnapshotLimit = 1
    BroadcastLimit = 5
    MaxMsgCount = 12

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    NoCommittedEntryDeletion
    DepthBoundDeep

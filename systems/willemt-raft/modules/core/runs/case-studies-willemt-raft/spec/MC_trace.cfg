\* Schedule constraint for the stale-leader witness. Same bounds as
\* MC_hunt_commit.cfg. No symmetry: s1, s2, s3 are distinguished.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    v1 = v1

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 5
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 3
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 6
    MaxMsgCount = 12

SPECIFICATION TraceSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    StaleLeaderWitness

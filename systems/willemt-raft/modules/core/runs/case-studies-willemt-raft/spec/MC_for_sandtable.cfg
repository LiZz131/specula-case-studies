\* Same bounds as MC.cfg. No symmetry: s1 must stay n1 during replay.
CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 3

    MaxTimeoutLimit = 2
    RequestLimit = 1
    CrashLimit = 0
    LoseLimit = 0
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 0
    MaxMsgCount = 4

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    TypeOK
    ElectionSafety
    LogConsistency
    DepthBound

\* SandTable replay of snapshot lifecycle.
\* Same numeric bounds as MC_hunt_snapshot.cfg. No symmetry: s1 stays n1.
\* Crash, Duplicate and BroadcastLimit are declared so the config matches
\* the Specula file. MCNext does not take Crash, Recover or Duplicate
\* (no stock syscall). AppendEntriesAll is the library send-all and is
\* not gated by BroadcastLimit. Lose runs only when that TCP channel
\* holds exactly one message, via clear.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 4
    RequestLimit = 3
    CrashLimit = 1
    LoseLimit = 2
    DuplicateLimit = 0
    SnapshotLimit = 2
    BroadcastLimit = 5
    MaxMsgCount = 10

SPECIFICATION MCSpec
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    NoCommittedEntryDeletion
    LogConsistency
    DepthBound


\* Term decrease via raft_begin_load_snapshot. Same style of bounds as
\* MC_hunt_vote.cfg, tightened to this schedule. No symmetry.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    s1 = s1
    s2 = s2
    s3 = s3
    v1 = v1

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    MaxTimeoutLimit = 4
    RequestLimit = 2
    CrashLimit = 0
    LoseLimit = 2
    DuplicateLimit = 0
    SnapshotLimit = 1
    BroadcastLimit = 4
    MaxMsgCount = 12

SPECIFICATION TraceSpec

PROPERTIES
    TermNeverDecreases
